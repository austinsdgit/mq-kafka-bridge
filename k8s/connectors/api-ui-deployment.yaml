apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mq-kafka-bridge
data:
  SRCQM_PORT: "1414"
  SRCQM_QMGR: "SRCQM"
  SRCQM_CHANNEL: "APP.SVRCONN"
  ALIAS_QUEUE: "INPUT.ALIAS"
  TGTQM_PORT: "1414"
  TGTQM_QMGR: "TGTQM"
  TGTQM_CHANNEL: "PYTHON.SVRCONN"
  INBOUND_QUEUE: "ORDERS.INBOUND"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mq-kafka-bridge
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: your-registry/mq-kafka-bridge-api:latest   # replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: SRCQM_HOST
              value: "srcqm-svc.mq-kafka-bridge.svc.cluster.local"
            - name: TGTQM_HOST
              value: "tgtqm-svc.mq-kafka-bridge.svc.cluster.local"
            - name: SRCQM_USER
              valueFrom:
                secretKeyRef:
                  name: mq-credentials
                  key: MQ_USER
            - name: SRCQM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mq-credentials
                  key: MQ_PASSWORD
            - name: TGTQM_USER
              valueFrom:
                secretKeyRef:
                  name: mq-credentials
                  key: MQ_USER
            - name: TGTQM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mq-credentials
                  key: MQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: mq-kafka-bridge
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# ── React UI (nginx serving the built static bundle) ──────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: mq-kafka-bridge
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: your-registry/mq-kafka-bridge-ui:latest   # replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ui-svc
  namespace: mq-kafka-bridge
spec:
  selector:
    app: ui
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# ── Nginx ConfigMap: proxy /api → api-svc so the UI and API share one hostname ─
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-nginx-conf
  namespace: mq-kafka-bridge
data:
  default.conf: |
    server {
      listen 80;

      # Serve the React SPA
      location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
      }

      # Proxy API calls to FastAPI
      location ~ ^/(messages|queue|throttle|health) {
        proxy_pass http://api-svc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
