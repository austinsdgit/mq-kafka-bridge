apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-primary
  namespace: kafka-primary
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
      # Retain messages for 24 h — the browse connector produces once/min
      # and the delete connector will clean up the MQ queue, so Kafka topic
      # retention is mainly a safety net.
      log.retention.hours: "24"
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: mq-orders-correlids
  namespace: kafka-primary
  labels:
    strimzi.io/cluster: kafka-primary
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"        # 24 h
    cleanup.policy: delete
    min.insync.replicas: "2"
